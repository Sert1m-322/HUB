<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labirint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- CLAUDE: панель с классами для стилей, id остались прежними -->
<div class="panel">
    <label>Width <input id="inputW" type="number" min="2" max="60" value="15"></label>
    <label>Height <input id="inputH" type="number" min="2" max="60" value="15"></label>
    <label>Teleport back, % <input id="inputT" type="number" min="0" max="100" value="30"></label>

    <button id="btnGenerate" class="primary">Generate</button>
    <button id="btnFind" class="primary">Find short path</button>

    <select name="Speed" id="speedSelect">
        <option value="250">Slow</option>
        <option value="20">Fast</option>
        <option value="-1">Instant</option>
    </select>

    <span class="score">Path: <span id="score">0</span></span>

    <button id="save" class="secondary">Save png</button>
    <button id="export" class="secondary">Export</button>
    <label class="file-btn secondary">Import
        <input type="file" id="import" accept=".json" hidden>
    </label>
</div>

    <canvas id="canvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
